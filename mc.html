<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f0d">
    <meta name="description" content="mc — the minecraft server">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://mysticalpengu.github.io/mc.html">
    <meta property="og:site_name" content="~/mythicalpengu">
    <meta property="og:url" content="https://mysticalpengu.github.io/mc.html">
    <meta property="og:title" content="~/mc">
    <meta property="og:description" content="mc — the minecraft server">
    <meta property="og:type" content="website">
    <title>~/mc</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mc">

    <a class="skip-link" href="#main">skip to content</a>

    <div class="ambient" aria-hidden="true"></div>

    <div class="shell">

        <header class="topbar">
            <a class="topbar__path" href="index.html" title="back home">
                <span class="topbar__prompt">~</span><span class="topbar__user">/mythicalpengu</span>
            </a>
            <nav class="topbar__nav" aria-label="site">
                <a class="topbar__link" href="index.html">home</a>
                <a class="topbar__link" href="about.html">about</a>
                <a class="topbar__link is-current" href="mc.html" aria-current="page">mc</a>
                <a class="topbar__link" href="notes.html">notes</a>
            </nav>
        </header>

        <main class="main main--wide" id="main">

            <section class="page-head">
                <h1 class="page-head__title"><span class="page-head__comment">//</span> mc</h1>
                <p class="page-head__sub">sometimes i play with my friends</p>
            </section>

            <section class="mc-card" id="mc-card" aria-label="minecraft server status">
                <div class="mc-card__head">
                    <span class="mc-card__status">
                        <span class="mc-widget__dot mc-widget__dot--checking" id="mc-page-dot"></span>
                        <span class="mc-card__status-label" id="mc-page-status">checking server...</span>
                    </span>
                </div>
                <p class="mc-card__motd" id="mc-page-motd" hidden></p>
                <div class="mc-card__meta">
                    <span id="mc-page-players"></span>
                    <span id="mc-page-version"></span>
                    <span class="mc-card__meta-note" id="mc-page-meta"></span>
                </div>
                <div class="mc-card__join">
                    <span class="mc-card__join-label">join:</span>
                    <button type="button" class="btn btn--ghost" id="mc-address" title="click to copy">
                        <span id="mc-address-text">—</span>
                    </button>
                </div>

                <details class="mc-control" id="mc-control" hidden>
                    <summary class="mc-control__summary">manage</summary>
                    <div class="mc-control__row">
                        <input class="field__input mc-control__pass" id="mc-control-pass" type="password"
                               placeholder="password" autocomplete="current-password" aria-label="control password">
                        <button type="button" class="btn" id="mc-start">start</button>
                        <button type="button" class="btn btn--danger" id="mc-stop">stop</button>
                    </div>
                    <p class="mc-control__state" id="mc-control-state" role="status"></p>
                </details>
            </section>

        </main>

        <footer class="footer">
            <span class="footer__copy">© <span id="footer-user">mythicalpengu</span> <span class="footer__year" id="footer-year"></span></span>
            <span class="footer__line">dont bother me</span>
        </footer>

    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript><p class="noscript">most of this site needs javascript to run.</p></noscript>

    <script type="module" src="js/mc-page.js"></script>
</body>
</html>
