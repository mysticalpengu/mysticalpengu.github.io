name = "mythicalpengu-notes"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "78535462ce8742d5b1750be87fe463fe"

[vars]
# public origin of the website (github pages url, no trailing slash)
ALLOWED_ORIGIN = "https://mysticalpengu.github.io"

# oauth redirect uri — must match the discord app settings exactly
REDIRECT_URI = "https://mythicalpengu-notes.mysticalpengu.workers.dev/auth/callback"

# secrets (set with `wrangler secret put`):
#   DISCORD_CLIENT_ID
#   DISCORD_CLIENT_SECRET
#   OWNER_DISCORD_ID  = 1497173080131371048
#   SESSION_SECRET
